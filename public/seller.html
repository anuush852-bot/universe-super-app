
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>UniVerse Seller</title>

  <meta name="theme-color" content="#7657ff">

  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="/manifest-seller.json">
  <link rel="apple-touch-icon" href="/pwa-192.png">
</head>

<body>

  <!-- Seller Navbar -->
  <nav class="navbar">
    <div class="logo">
      🏪 <span>Uni</span>verse Seller
    </div>

    <button type="button" class="ghost" onclick="logout()">
      Logout
    </button>
  </nav>

  <!-- Seller Dashboard -->
  <main
    class="sec"
    style="max-width:1000px;margin:auto;padding-top:25px"
  >
    <div id="app"></div>
  </main>

  <!-- Toast Notification -->
  <div id="toast"></div>

  <script>
    var KEY = 'st';
  </script>

  <script src="./common.js"></script>
  <script src="./seller.js"></script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js")
        .catch(error => {
          console.error("Service Worker Error:", error);
        });
    }
  </script>

</body>
</html>
